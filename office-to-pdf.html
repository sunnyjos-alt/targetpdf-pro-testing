<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office to PDF - TargetPDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #3B82F6; --primary-hover: #2563EB; --bg: #F8FAFC; --text: #1E293B; --border: #E2E8F0; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 40px 20px; margin: 0; min-height: 100vh; }
        .container { background: white; width: 100%; max-width: 600px; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); text-align: center; height: fit-content; }
        h1 { font-size: 26px; margin: 0 0 8px 0; color: #0F172A; letter-spacing: -0.5px; }
        p.subtitle { color: #64748B; margin: 0 0 30px 0; font-size: 15px; }
        .drop-zone { border: 2px dashed #CBD5E1; border-radius: 12px; padding: 40px 20px; cursor: pointer; transition: all 0.2s ease; background: #F8FAFC; margin-bottom: 24px; }
        .drop-zone:hover { border-color: var(--primary); background: #EFF6FF; }
        .drop-zone.active { border-color: var(--primary); background: #EFF6FF; }
        input[type="file"] { display: none; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px 24px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .btn-reset { background: white; color: #64748B; border: 1px solid var(--border); margin-top: 16px; display: none; }
        .btn-reset:hover { background: #F1F5F9; color: #0F172A; }
        .spinner { display: none; border: 3px solid #E2E8F0; border-top: 3px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .back-link { display: block; margin-bottom: 20px; color: #64748B; text-decoration: none; font-weight: 500; text-align: left; }
        .back-link:hover { color: var(--primary); }
    </style>

<style id="targetpdf-pro-polish">
  :root { --tp-ink:#12213a; --tp-muted:#64748b; --tp-blue:#315efb; --tp-line:#e2e8f0; --tp-panel:#ffffff; }
  html { min-height:100%; background:#f4f7fc; }
  body { min-height:100vh !important; margin:0 !important; padding:clamp(22px,4vw,54px) clamp(14px,3vw,36px) !important; align-items:flex-start !important; justify-content:center !important; background:radial-gradient(ellipse at 12% 0%,rgba(49,94,251,.10),transparent 35%),radial-gradient(ellipse at 95% 12%,rgba(14,165,233,.08),transparent 30%),#f4f7fc !important; color:var(--tp-ink) !important; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif !important; }
  .container { width:min(100%,1040px) !important; max-width:1040px !important; min-height:540px; margin:0 auto !important; padding:clamp(24px,4vw,48px) !important; background:rgba(255,255,255,.97) !important; border:1px solid rgba(226,232,240,.9) !important; border-radius:24px !important; box-shadow:0 22px 60px rgba(15,35,75,.09) !important; text-align:left !important; }
  .back-link { display:inline-flex !important; align-items:center; gap:8px; margin:0 0 28px !important; padding:9px 13px; border:1px solid var(--tp-line); border-radius:999px; background:#fff; color:var(--tp-muted) !important; text-decoration:none; font-size:13px; font-weight:650; }
  h1 { margin:0 0 10px !important; color:#0f172a !important; font-size:clamp(28px,4vw,40px) !important; letter-spacing:-1px !important; line-height:1.15; }
  .subtitle { max-width:720px; margin:0 0 28px !important; color:var(--tp-muted) !important; font-size:16px; line-height:1.7; }
  .drop-zone { min-height:210px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:34px 22px !important; margin:0 0 18px !important; border:2px dashed #b9c8e0 !important; border-radius:18px !important; background:linear-gradient(180deg,#fbfdff,#f5f8ff) !important; text-align:center !important; cursor:pointer; }
  .drop-zone:hover,.drop-zone.active { border-color:#315efb !important; background:#eff5ff !important; }
  .drop-zone p { text-align:center; }
  .btn { min-height:52px !important; padding:15px 22px !important; border-radius:12px !important; font-size:15px !important; font-weight:750 !important; box-shadow:0 5px 12px rgba(49,94,251,.12); }
  .btn-reset,.btn-secondary { margin-top:12px !important; background:#fff !important; color:#344256 !important; border:1px solid #d8e0ec !important; box-shadow:none !important; }
  .controls { margin:14px 0 18px; }
  select { max-width:100%; padding:12px 14px; border:1px solid #cbd5e1; border-radius:10px; background:#fff; color:#1e293b; font:inherit; }
  .results,.success-box { margin-top:22px !important; padding:22px !important; border:1px solid #dbeafe !important; border-radius:16px !important; background:#f8fbff !important; }
  @media(max-width:640px) { body { padding:12px !important; } .container { min-height:0; padding:22px 17px !important; border-radius:18px !important; } .back-link { margin-bottom:22px !important; } .drop-zone { min-height:175px; padding:25px 14px !important; } }
</style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to TargetPDF</a>
        <h1>Office to PDF</h1>
        <p class="subtitle">Convert Word, Excel, or Text into a PDF file.</p>
        
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('officeFile').click()">
            <div style="font-size: 32px; margin-bottom: 8px;">📄</div>
            <p style="margin:0; font-weight:600; color:var(--primary);" id="dropText">Click to select a document</p>
            <p style="margin:4px 0 0; font-size:14px; color:#64748B;" id="fileName">No file selected</p>
        </div>
        
        <input type="file" id="officeFile" accept=".docx, .xlsx, .txt">
        
        <button id="convertBtn" class="btn" style="display:none;" onclick="convertToPdf()">
            <span id="btnText">Convert to PDF</span>
            <div id="loading" class="spinner"></div>
        </button>
        
        <button id="resetBtn" class="btn btn-reset" onclick="resetTool()">Start Over</button>
    </div>

    <script>
        document.getElementById('officeFile').addEventListener('change', function() {
            if(this.files.length > 0) {
                document.getElementById('fileName').innerText = this.files[0].name;
                document.getElementById('dropText').innerText = "File Selected";
                document.getElementById('dropZone').classList.add('active');
                document.getElementById('convertBtn').style.display = 'flex';
                document.getElementById('resetBtn').style.display = 'block';
            }
        });

        async function convertToPdf() {
            const fileInput = document.getElementById('officeFile');
            const convertBtn = document.getElementById('convertBtn');
            const btnText = document.getElementById('btnText');
            const loading = document.getElementById('loading');

            if (fileInput.files.length === 0) return;
            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop().toLowerCase();

            convertBtn.disabled = true;
            btnText.innerText = "Converting...";
            loading.style.display = 'block';

            try {
                let htmlContent = "";
                if (fileExt === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer });
                    htmlContent = result.value;
                } else if (fileExt === 'xlsx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                    htmlContent = XLSX.utils.sheet_to_html(workbook.Sheets[workbook.SheetNames[0]]);
                } else if (fileExt === 'txt') {
                    const text = await file.text();
                    htmlContent = `<pre style="white-space: pre-wrap; font-family: sans-serif;">${text}</pre>`;
                } else {
                    throw new Error("Unsupported format");
                }

                const element = document.createElement('div');
                element.innerHTML = htmlContent;
                element.style.padding = '20px';
                element.style.fontFamily = 'Arial, sans-serif';

                const opt = {
                    margin: 10, filename: 'TargetPDF_Converted.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                await html2pdf().set(opt).from(element).save();
                btnText.innerText = "Convert Again";
            } catch (error) {
                alert("Error converting file. Please make sure it is a valid Word, Excel, or Text file.");
                btnText.innerText = "Convert to PDF";
            } finally {
                convertBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function resetTool() {
            document.getElementById('officeFile').value = '';
            document.getElementById('fileName').innerText = "No file selected";
            document.getElementById('dropText').innerText = "Click to select a document";
            document.getElementById('dropZone').classList.remove('active');
            document.getElementById('convertBtn').style.display = 'none';
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('btnText').innerText = "Convert to PDF";
        }
    </script>
</body>
</html>
