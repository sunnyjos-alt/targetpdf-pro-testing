<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to PPT - TargetPDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <style>
        :root { --primary: #ec4899; --primary-hover: #be185d; --bg: #F8FAFC; --text: #1E293B; --border: #E2E8F0; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 40px 20px; margin: 0; min-height: 100vh; }
        .container { background: white; width: 100%; max-width: 600px; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); text-align: center; height: fit-content; }
        h1 { font-size: 26px; margin: 0 0 8px 0; color: #0F172A; letter-spacing: -0.5px; }
        p.subtitle { color: #64748B; margin: 0 0 30px 0; font-size: 15px; }
        .drop-zone { border: 2px dashed #CBD5E1; border-radius: 12px; padding: 40px 20px; cursor: pointer; transition: all 0.2s ease; background: #F8FAFC; margin-bottom: 24px; }
        .drop-zone:hover { border-color: var(--primary); background: #FDF2F8; }
        .drop-zone.active { border-color: var(--primary); background: #FDF2F8; }
        input[type="file"] { display: none; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px 24px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-reset { background: white; color: #64748B; border: 1px solid var(--border); margin-top: 16px; display: none; }
        .spinner { display: none; border: 3px solid #E2E8F0; border-top: 3px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .back-link { display: block; margin-bottom: 20px; color: #64748B; text-decoration: none; font-weight: 500; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to TargetPDF</a>
        <h1>PDF to PPT</h1>
        <p class="subtitle">Convert PDF pages into image-based PowerPoint slides.</p>
        
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('pdfFile').click()">
            <div style="font-size: 32px; margin-bottom: 8px;">📽️</div>
            <p style="margin:0; font-weight:600; color:var(--primary);" id="dropText">Click to select a PDF</p>
            <p style="margin:4px 0 0; font-size:14px; color:#64748B;" id="fileName">No file selected</p>
        </div>
        
        <input type="file" id="pdfFile" accept=".pdf">
        
        <button id="convertBtn" class="btn" style="display:none;" onclick="convertPdfToPpt()">
            <span id="btnText">Convert to PPT</span>
            <div id="loading" class="spinner"></div>
        </button>
        
        <button id="resetBtn" class="btn btn-reset" onclick="resetTool()">Start Over</button>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        document.getElementById('pdfFile').addEventListener('change', function() {
            if(this.files.length > 0) {
                document.getElementById('fileName').innerText = this.files[0].name;
                document.getElementById('dropText').innerText = "File Selected";
                document.getElementById('dropZone').classList.add('active');
                document.getElementById('convertBtn').style.display = 'flex';
                document.getElementById('resetBtn').style.display = 'block';
            }
        });

        async function convertPdfToPpt() {
            const fileInput = document.getElementById('pdfFile');
            const convertBtn = document.getElementById('convertBtn');
            const btnText = document.getElementById('btnText');
            const loading = document.getElementById('loading');

            if (fileInput.files.length === 0) return;
            const file = fileInput.files[0];

            convertBtn.disabled = true;
            btnText.innerText = "Processing...";
            loading.style.display = 'block';

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                
                let pptx = new PptxGenJS();
                pptx.layout = 'LAYOUT_WIDE'; 

                for (let i = 1; i <= pdf.numPages; i++) {
                    btnText.innerText = `Converting Page ${i} / ${pdf.numPages}...`;
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 2.0 });
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.95);

                    let slide = pptx.addSlide();
                    slide.addImage({ data: dataUrl, x: 0, y: 0, w: 13.33, h: 7.5 }); 
                }

                btnText.innerText = "Downloading PPT...";
                await pptx.writeFile({ fileName: "TargetPDF_Converted.pptx" });
                btnText.innerText = "Convert Again";
            } catch (error) {
                alert("Error converting PDF. Please try again.");
                btnText.innerText = "Convert to PPT";
            } finally {
                convertBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function resetTool() {
            document.getElementById('pdfFile').value = '';
            document.getElementById('fileName').innerText = "No file selected";
            document.getElementById('dropText').innerText = "Click to select a PDF";
            document.getElementById('dropZone').classList.remove('active');
            document.getElementById('convertBtn').style.display = 'none';
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('btnText').innerText = "Convert to PPT";
        }
    </script>
</body>
</html>
